<style>
  :root{
    --navy-900:#1a1a2e; --navy-800:#232340; --teal-500:#6366f1; --teal-400:#818cf8; --teal-300:#a5b4fc;
    --ink:#122029; --ink-soft:#516170; --ink-faint:#8a99a4;
    --bg:#f4faf9; --border:#dfe9e7;
    --font-head:'Poppins',-apple-system,'Segoe UI',sans-serif;
    --font-body:'Inter',-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-body);background:var(--bg);color:var(--ink)}
  a{text-decoration:none;color:inherit}

  .card-wrap{max-width:440px;margin:0 auto;min-height:100vh;background:#fff;box-shadow:0 0 60px rgba(10,31,46,.08)}

  .hero{
    position:relative;padding:44px 28px 34px;text-align:center;color:#fff;overflow:hidden;
    background:linear-gradient(160deg,var(--navy-900) 0%,var(--navy-800) 55%,#134156 100%);
  }
  .hero::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 85% -10%, rgba(20,184,166,.35), transparent 55%);
  }
  .hero-inner{position:relative}
  .avatar{
    width:84px;height:84px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--teal-400),var(--teal-500));
    font-family:var(--font-head);font-weight:700;font-size:28px;color:#fff;
    box-shadow:0 6px 20px rgba(0,0,0,.25);border:3px solid rgba(255,255,255,.15);
  }
  .hero h1{font-family:var(--font-head);font-weight:800;font-size:24px;margin:0 0 4px;letter-spacing:-.01em}
  .hero p{font-size:14px;color:var(--teal-300);margin:0;font-weight:600;font-family:var(--font-head);letter-spacing:.02em}

  .actions{display:grid;grid-template-columns:repeat(3,1fr);background:var(--navy-800)}
  .actions a{
    display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 4px 14px;
    color:#dff3f0;font-size:11.5px;font-weight:600;font-family:var(--font-head);
    border-left:1px solid rgba(255,255,255,.08);transition:background .15s;
  }
  .actions a:first-child{border-left:none}
  .actions a:active{background:rgba(255,255,255,.08)}
  .actions svg{width:20px;height:20px;stroke:var(--teal-300)}

  .section{padding:22px 24px}
  .info-row{
    display:flex;align-items:flex-start;gap:14px;padding:14px 0;border-bottom:1px solid var(--border);
  }
  .info-row:last-child{border-bottom:none}
  .info-icon{
    width:38px;height:38px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;
    flex-shrink:0;color:var(--teal-500);
  }
  .info-icon svg{width:18px;height:18px}
  .info-main{min-width:0}
  .info-value{font-family:var(--font-head);font-weight:600;font-size:14.5px;color:var(--ink);word-break:break-word}
  .info-label{font-size:12px;color:var(--ink-faint);margin-top:1px}

  .cta-row{padding:4px 24px 32px}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    padding:14px 18px;border-radius:12px;font-family:var(--font-head);font-weight:600;font-size:14.5px;
  }
  .btn svg{width:17px;height:17px}
  .btn-primary{background:linear-gradient(120deg,var(--teal-400),var(--teal-500));color:#fff}
  .btn-primary:active{transform:scale(.98)}
</style>
</head>
