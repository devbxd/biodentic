<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biodentic — Coming Soon</title>
<meta name="description" content="Biodentic, dental equipment and consumables supplier in Lebanon. Our new website is coming soon.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Inter',sans-serif;
    background:linear-gradient(180deg,#0a1f2e 0%,#0e2c3f 55%,#134156 100%);
    color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;text-align:center;
  }
  .card{max-width:520px}
  .mark{width:72px;height:72px;margin:0 auto 24px}
  .wordmark{font-family:'Poppins',sans-serif;font-weight:700;font-size:26px;letter-spacing:-.01em}
  .tag{font-family:'Poppins',sans-serif;font-size:11px;font-weight:600;letter-spacing:.24em;
    text-transform:uppercase;color:#5eead4;margin-top:6px}
  h1{font-family:'Poppins',sans-serif;font-weight:700;font-size:32px;line-height:1.25;
    margin:32px 0 14px;background:linear-gradient(90deg,#fff,#5eead4);-webkit-background-clip:text;
    background-clip:text;color:transparent}
  p{color:#c7d7de;font-size:15.5px;line-height:1.6;margin-bottom:28px}
  .contact{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .btn{
    display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:10px;
    font-family:'Poppins',sans-serif;font-weight:600;font-size:14.5px;text-decoration:none;
    transition:transform .15s;
  }
  .btn:hover{transform:translateY(-2px)}
  .btn-primary{background:linear-gradient(90deg,#0d9488,#14b8a6);color:#fff}
  .btn-ghost{border:1px solid rgba(255,255,255,.25);color:#fff}
  .btn svg{width:17px;height:17px}
</style>
</head>
<body>
  <div class="card">
    <img src="assets/logo-mark.svg" alt="Biodentic" class="mark">
    <div class="wordmark">Biodentic</div>
    <div class="tag">For Dental Supplies</div>
    <h1>We're updating our catalog</h1>
    <p>Our website is temporarily offline while we rebuild our product catalog with accurate photos, descriptions and categories. We'll be back online shortly — thank you for your patience.</p>
    <div class="contact">
      <a href="https://wa.me/96171844249" target="_blank" rel="noopener" class="btn btn-primary">
