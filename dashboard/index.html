<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Biodentic — Dashboard</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/logo-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/dashboard/dashboard.css">
</head>
<body>

<div id="app" class="app">

  <header class="app-header">
    <div class="app-header-left">
      <img src="/assets/logo-mark.svg" alt="" class="app-logo">
      <span class="app-title">Dashboard</span>
    </div>
  </header>

  <div class="toolbar">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="search" id="search-input" placeholder="Search products…">
    </div>
    <select id="category-filter"><option value="">All categories</option></select>
    <button id="add-product-btn" class="btn-primary btn-add">+ Add product</button>
  </div>

  <p id="result-count" class="result-count"></p>

  <div id="product-grid" class="product-grid"></div>
  <p id="empty-state" class="empty-state" hidden>No products found.</p>
  <div id="loading-state" class="loading-state">Loading products…</div>
</div>

<!-- ===================== EDIT / ADD PANEL ===================== -->
<div id="editor-overlay" class="editor-overlay" hidden>
  <div class="editor-panel">
    <div class="editor-head">
      <h2 id="editor-title">Edit product</h2>
      <button id="editor-close" class="icon-btn" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="editor-body">
      <label class="field-label">Photos</label>
      <div id="image-list" class="image-list"></div>
      <label class="add-image-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <span>Add photo</span>
        <input type="file" id="image-input" accept="image/*" multiple hidden>
      </label>
      <p id="image-status" class="image-status"></p>

      <label class="field-label" for="f-name">Product name</label>
      <input type="text" id="f-name" placeholder="e.g. Rubber Dappen Dish">

      <label class="field-label" for="f-category">Category</label>
      <select id="f-category"></select>

      <label class="field-label" for="f-description">Description</label>
      <textarea id="f-description" rows="4" placeholder="Short description, sizes, colors…"></textarea>

      <label class="field-label" for="f-variants">Variants (one per line, optional)</label>
      <textarea id="f-variants" rows="3" placeholder="Small&#10;Medium&#10;Large"></textarea>

      <p id="save-error" class="error-text" hidden></p>
    </div>

    <div class="editor-footer">
      <button id="delete-btn" class="btn-danger">Delete</button>
      <div class="editor-footer-right">
        <button id="cancel-btn" class="btn-ghost-sm">Cancel</button>
        <button id="save-btn" class="btn-primary">Save</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="/dashboard/dashboard.js"></script>
</body>
</html>
